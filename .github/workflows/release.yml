name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use for npm publish'
        required: true
      skip_goreleaser:
        description: 'Skip goreleaser job (npm-only release)'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write  # Required for npm trusted publishing (OIDC)

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || !inputs.skip_goreleaser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The kit binary embeds the Rust kit-tunnel sidecar; goreleaser's
      # per-target build hooks cross-compile it with cargo-zigbuild.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            x86_64-unknown-linux-gnu,
            aarch64-unknown-linux-gnu,
            x86_64-apple-darwin,
            aarch64-apple-darwin,
            x86_64-pc-windows-gnu,
            aarch64-pc-windows-gnullvm

      - name: Set up zig (cross toolchain)
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
          use-cache: false

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # zig alone cannot link Apple frameworks (CoreFoundation,
      # SystemConfiguration) that the iroh dependencies of kit-tunnel need.
      # cargo-zigbuild reads SDKROOT and points the linker at the SDK, so the
      # darwin cross builds need a macOS SDK staged on the runner.
      - name: Set up macOS SDK (darwin cross builds)
        env:
          SDK_VERSION: "14.5"
          SDK_SHA256: 6e146275d19f027faa2e8354da5e0267513abf013b8f16ad65a231653a2b1c5d
        run: |
          set -euo pipefail
          url="https://github.com/joseluisq/macosx-sdks/releases/download/${SDK_VERSION}/MacOSX${SDK_VERSION}.sdk.tar.xz"
          curl -fsSL "$url" -o /tmp/macos-sdk.tar.xz
          echo "${SDK_SHA256}  /tmp/macos-sdk.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt
          sudo tar -xJf /tmp/macos-sdk.tar.xz -C /opt
          echo "SDKROOT=/opt/MacOSX${SDK_VERSION}.sdk" >> "$GITHUB_ENV"

      # --parallelism 1 keeps target builds sequential: the per-target pre
      # hook stages the sidecar into the shared go:embed directory, and
      # parallel builds could embed a sibling's sidecar mid-staging.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Keep floating major/minor tags (e.g. v1, v1.2) pointing at the latest
  # release so the composite action can be referenced as `mark3labs/kit@v1`.
  action-tags:
    runs-on: ubuntu-latest
    needs: goreleaser
    if: ${{ github.event_name == 'push' && needs.goreleaser.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update floating major/minor tags
        env:
          FULL_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # FULL_TAG looks like v1.2.3 — derive v1 and v1.2.
          VER="${FULL_TAG#v}"
          MAJOR="v${VER%%.*}"
          MINOR="v${VER%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for t in "$MAJOR" "$MINOR"; do
            echo "Pointing $t at $FULL_TAG"
            git tag -f "$t" "$FULL_TAG"
            git push -f origin "refs/tags/$t"
          done

  # Rebuild the GHCR sandbox image so it ships the just-released kit binary.
  # Called directly instead of relying on a `release: [published]` trigger in
  # sandbox-image.yml: goreleaser publishes the release with GITHUB_TOKEN, and
  # GITHUB_TOKEN-raised events never start new workflow runs. Passing the tag
  # explicitly also lets that workflow emit vX.Y.Z / vX.Y image tags.
  sandbox-image:
    needs: goreleaser
    if: ${{ github.event_name == 'push' && needs.goreleaser.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/sandbox-image.yml
    with:
      kit_version: ${{ github.ref_name }}

  npm-publish:
    runs-on: ubuntu-latest
    needs: goreleaser
    if: ${{ always() && (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        working-directory: npm
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          VERSION=${TAG#v}
          echo "Setting npm version to $VERSION"
          npm version $VERSION --no-git-tag-version

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify:
    runs-on: ubuntu-latest
    needs: [goreleaser, npm-publish]
    if: ${{ always() && (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped') && (needs.npm-publish.result == 'success') }}
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.RELEASES_WEBHOOK }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag || github.ref_name }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"New Release: $TAG_NAME\",
                \"description\": \"A new version of kit has been released!\",
                \"color\": 5814783,
                \"fields\": [
                  {
                    \"name\": \"Version\",
                    \"value\": \"$TAG_NAME\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Repository\",
                    \"value\": \"[kit](https://github.com/${{ github.repository }})\",
                    \"inline\": true
                  }
                ],
                \"footer\": {
                  \"text\": \"Released via GitHub Actions\"
                },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\",
                \"url\": \"$RELEASE_URL\"
              }]
            }" \
            $DISCORD_WEBHOOK
