name: Release

on:
  push:
    tags:
      # Full versions only, so a floating alias tag (v0, and formerly v0.1)
      # can never start a release of its own.
      #
      # An alias pushed by hand alongside the version — `git push origin
      # v0.108.0 v0.108` — matched a `v*` pattern and started a SECOND,
      # identical release run. Both built the same artifacts and raced to
      # upload them; the loser died on `already_exists`, and npm-publish
      # (needs: goreleaser) was skipped — so the GitHub release looked
      # complete while npm stayed on the previous version. The alias the
      # bot pushes below is exempt for a different reason (GITHUB_TOKEN
      # pushes never raise workflow events), but a human's is not, and
      # this pattern covers both.
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use for npm publish'
        required: true
      skip_goreleaser:
        description: 'Skip goreleaser job (npm-only release)'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write  # Required for npm trusted publishing (OIDC)

# One release at a time, repo-wide. The tag filter above is the real fix
# for the alias race; this is the backstop for everything else that can
# put two releases in flight at once (a re-run, a hand-pushed tag, two
# versions tagged back to back). Queue rather than cancel: a half-done
# release that gets cancelled mid-upload is worse than a slow one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || !inputs.skip_goreleaser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Keep the floating major tag (e.g. v1) pointing at the latest release,
  # so the composite action can be referenced as `mark3labs/kit@v1` — which
  # is exactly what `kit github install` scaffolds into a user's workflow
  # (see cmd/github.go). This tag is load-bearing: leaving it behind pins
  # every scaffolded workflow to whatever release it last pointed at.
  #
  # Only the major tag. A floating minor (v1.2) has no consumer anywhere —
  # nothing references the action that way — and every alias is another
  # tag push that the release trigger has to be careful not to answer.
  action-tags:
    runs-on: ubuntu-latest
    needs: goreleaser
    if: ${{ github.event_name == 'push' && needs.goreleaser.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update floating major tag
        env:
          FULL_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # FULL_TAG looks like v1.2.3 — derive v1.
          VER="${FULL_TAG#v}"
          MAJOR="v${VER%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Pointing $MAJOR at $FULL_TAG"
          git tag -f "$MAJOR" "$FULL_TAG"
          git push -f origin "refs/tags/$MAJOR"

  # Rebuild the GHCR sandbox image so it ships the just-released kit binary.
  # Called directly instead of relying on a `release: [published]` trigger in
  # sandbox-image.yml: goreleaser publishes the release with GITHUB_TOKEN, and
  # GITHUB_TOKEN-raised events never start new workflow runs. Passing the tag
  # explicitly also lets that workflow emit vX.Y.Z / vX.Y image tags.
  sandbox-image:
    needs: goreleaser
    if: ${{ github.event_name == 'push' && needs.goreleaser.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/sandbox-image.yml
    with:
      kit_version: ${{ github.ref_name }}

  npm-publish:
    runs-on: ubuntu-latest
    needs: goreleaser
    if: ${{ always() && (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        working-directory: npm
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          VERSION=${TAG#v}
          echo "Setting npm version to $VERSION"
          npm version $VERSION --no-git-tag-version

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify:
    runs-on: ubuntu-latest
    needs: [goreleaser, npm-publish]
    if: ${{ always() && (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped') && (needs.npm-publish.result == 'success') }}
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.RELEASES_WEBHOOK }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag || github.ref_name }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"New Release: $TAG_NAME\",
                \"description\": \"A new version of kit has been released!\",
                \"color\": 5814783,
                \"fields\": [
                  {
                    \"name\": \"Version\",
                    \"value\": \"$TAG_NAME\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Repository\",
                    \"value\": \"[kit](https://github.com/${{ github.repository }})\",
                    \"inline\": true
                  }
                ],
                \"footer\": {
                  \"text\": \"Released via GitHub Actions\"
                },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\",
                \"url\": \"$RELEASE_URL\"
              }]
            }" \
            $DISCORD_WEBHOOK
