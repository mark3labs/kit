name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: every job here only checks out the repo and runs builds,
# tests or linters. None of them write back, so the default token never needs
# more than read access. Matches the explicit blocks in release.yml and
# sandbox-image.yml.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: golangci/golangci-lint-action@v8
        with:
          # Must be built with Go >= the version targeted in go.mod (1.27),
          # otherwise golangci-lint refuses to load the config with
          # "the Go language version used to build golangci-lint is lower
          # than the targeted Go version".
          version: v2.13.1

  # Advisory only: staticcheck with ALL checks enabled (default excludes the
  # stylistic ST* family). Findings here do not block merges; the blocking
  # staticcheck/unused checks run through golangci-lint in the lint job.
  # Pinned via go run so it never depends on a stale binary on PATH
  # (see issue #123).
  staticcheck-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # Only the staticcheck step is advisory; checkout and Go setup
      # failures must still fail the job.
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -checks=all ./...
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - run: go test -race ./...

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contrib/kit-tunnel

      - name: Test kit-tunnel
        run: cargo test --release --manifest-path contrib/kit-tunnel/Cargo.toml
