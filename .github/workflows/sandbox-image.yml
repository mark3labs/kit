name: Sandbox Image

# Build the official Kit sandbox image and publish it to GHCR. The image is a
# ready-to-run Linux userland (Go + kit + gh/glab/tea + git/ssh) intended to be
# registered as a workdir.dev custom image:
#
#   POST /v1/images
#   { "source": { "type": "oci",
#                 "image_ref": "ghcr.io/mark3labs/kit-sandbox:latest" },
#     "name": "custom/mark3labs/kit-sandbox" }
#
# Then create sandboxes with { "image": "custom/mark3labs/kit-sandbox", ... }.

on:
  push:
    branches: [master]
    paths:
      - "deploy/sandbox/**"
      - ".github/workflows/sandbox-image.yml"
  # Rebuild on every release so the image tracks the latest kit binary.
  #
  # This is driven by release.yml calling us (needs: goreleaser) rather than by
  # a `release: [published]` trigger. Goreleaser publishes the release using the
  # built-in GITHUB_TOKEN, and events raised by GITHUB_TOKEN deliberately do not
  # start new workflow runs -- so a `release` trigger here never fires. Being
  # called explicitly also lets the caller hand us the exact tag, so the semver
  # image tags below resolve instead of silently going missing.
  workflow_call:
    inputs:
      kit_version:
        description: "kit version to install (go install ...@VERSION)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      kit_version:
        description: "kit version to install (go install ...@VERSION)"
        required: false
        type: string
        default: "latest"

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-sandbox # ghcr.io/mark3labs/kit-sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Actions are pinned to immutable commit SHAs (comments preserve the
      # human-readable version) so an upstream retag can't alter this
      # package-publishing pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve kit version
        id: kitver
        env:
          # Set for both workflow_call (the release tag) and workflow_dispatch.
          # Empty on a plain master push, which builds against @latest.
          INPUT_KIT_VERSION: ${{ inputs.kit_version || '' }}
        run: |
          version="${INPUT_KIT_VERSION:-latest}"
          # Reject anything that could smuggle shell/newlines into later steps.
          case "$version" in
            *$'\n'*|*$'\r'*|*' '*|*';'*|*'&'*|*'|'*|*'$'*|*'`'*)
              echo "invalid kit version: $version" >&2; exit 1 ;;
          esac
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is declared explicitly for both cases below, so turn off the
          # default latest=auto handling rather than have two rules race.
          flavor: latest=false
          # The semver rules read the git ref, so they only match when we are
          # called from a tag push (release.yml). They must NOT be scoped to
          # `event=release`: as a reusable workflow, github.event_name is the
          # caller's event (push), so an event=release filter never matches.
          # prefix=v keeps release image tags as vX.Y.Z / vX.Y; without it
          # docker/metadata-action strips the leading v (v1.2.3 -> 1.2.3).
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/sandbox/Dockerfile
          # workdir runs x86_64 Firecracker microVMs.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KIT_VERSION=${{ steps.kitver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
