[package]
name = "kit-tunnel"
version = "0.1.0"
edition = "2021"
description = "Transport sidecar for kit remote sessions: pairs two terminals over iroh and relays terminal frames."

[dependencies]
iroh = { version = "1.1", features = ["tls-ring"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "sync", "time"] }
anyhow = "1"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.9"
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = "2"

[profile.release]
strip = true
lto = true
